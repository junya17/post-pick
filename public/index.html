<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>選別 — どれを出すか決める</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;800&family=Murecho:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme: light only;
  --surround:#D8D8D8;
  --paper:#FFFFFF;
  --ink:#16181A;
  --mute:#6E7278;
  --line:#CBCBCB;
  --empty:#E2E2E2;
  --flag:#D0271D;
  --lat:"Archivo", system-ui, sans-serif;
  --jp:"Murecho", system-ui, sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  background:var(--surround);color:var(--ink);
  font-family:var(--jp);font-size:15px;line-height:1.85;
  -webkit-font-smoothing:antialiased;
}
.wrap{max-width:900px;margin:0 auto;padding:40px 20px 90px}
[hidden]{display:none !important}
:focus-visible{outline:2px solid var(--ink);outline-offset:3px}

.eyebrow{font-family:var(--lat);font-weight:600;font-size:10.5px;letter-spacing:.26em;color:var(--mute);margin:0 0 12px}
h1{font-family:var(--lat);font-weight:800;font-size:clamp(38px,8vw,64px);line-height:.95;letter-spacing:-.02em;margin:0 0 16px}
h1 span{font-family:var(--jp);font-weight:700;font-size:.42em;letter-spacing:.12em;display:block;margin-top:14px;color:var(--mute)}
.lede{max-width:40em;margin:0 0 30px;color:#44474B;font-size:14.5px}

/* ---------- 候補を並べる ---------- */
.drop{
  background:var(--paper);border:1px solid var(--line);
  min-height:150px;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:8px;text-align:center;padding:34px 24px;cursor:pointer;width:100%;
  transition:border-color .18s ease;
}
.drop:hover,.drop.over{border-color:var(--ink)}
.drop strong{font-weight:700;font-size:17px;letter-spacing:.04em}
.drop small{font-size:12px;color:var(--mute);max-width:26em;line-height:1.7}

.sheet{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px;margin-top:12px}
.frame{position:relative;background:var(--paper);border:1px solid var(--line);padding:6px;line-height:0}
.frame img{width:100%;aspect-ratio:3/2;object-fit:cover;display:block}
.frame b{
  position:absolute;top:10px;left:10px;
  font-family:var(--lat);font-weight:600;font-size:10px;letter-spacing:.1em;
  background:var(--ink);color:var(--paper);padding:3px 7px;line-height:1.4;
}
.frame .x{
  position:absolute;top:8px;right:8px;width:24px;height:24px;padding:0;
  font-size:14px;line-height:1;background:var(--paper);color:var(--mute);
  border:1px solid var(--line);cursor:pointer;
}
.frame .x:hover{color:var(--flag);border-color:var(--flag)}

.tools{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:18px}
button{
  font-family:var(--jp);font-weight:500;font-size:14px;letter-spacing:.04em;
  padding:12px 26px;border:1px solid var(--ink);background:var(--ink);color:var(--paper);cursor:pointer;
}
button:hover{background:#000}
button[disabled]{opacity:.35;cursor:not-allowed}
button.ghost{background:transparent;color:var(--ink)}
button.ghost:hover{background:var(--paper)}
select,input[type=password],textarea{
  font-family:var(--jp);font-size:14px;background:var(--paper);
  border:1px solid var(--line);padding:11px 13px;color:var(--ink);
}
select{cursor:pointer}
input[type=password]{width:130px}
textarea{width:100%;margin-top:16px;resize:vertical;min-height:60px;line-height:1.7}
textarea::placeholder{color:#9A9DA2}
label.f{display:block;font-family:var(--lat);font-weight:600;font-size:10px;letter-spacing:.2em;color:var(--mute);margin:20px 0 6px}
.msg{margin-top:16px;font-size:13.5px;padding:13px 15px;background:var(--paper);border-left:3px solid var(--flag);color:#3A3D41}
.msg.working{border-left-color:var(--ink);color:var(--mute)}

/* ---------- 結果 ---------- */
#out{margin-top:44px;border-top:1px solid var(--line);padding-top:30px}
.won{background:var(--paper);border:1px solid var(--ink);padding:10px;line-height:0;position:relative}
.won img{width:100%;display:block}
.won b{
  position:absolute;top:20px;left:20px;
  font-family:var(--lat);font-weight:600;font-size:11px;letter-spacing:.16em;
  background:var(--ink);color:var(--paper);padding:5px 11px;line-height:1.4;
}
.detail{background:var(--paper);border:1px solid var(--line);border-top:0;padding:24px 22px}
.detail dl{margin:0;font-size:14px;line-height:1.85}
.detail dt{font-family:var(--lat);font-weight:600;font-size:9.5px;letter-spacing:.18em;color:var(--mute);margin-top:16px;text-transform:uppercase}
.detail dt:first-child{margin-top:0}
.detail dd{margin:2px 0 0;color:#2E3135}

.rest{margin:26px 0 0;padding:0;list-style:none}
.rest li{display:flex;gap:14px;align-items:flex-start;padding:14px 0;border-top:1px solid var(--line)}
.rest img{width:76px;aspect-ratio:3/2;object-fit:cover;flex:none;display:block;filter:grayscale(1);opacity:.75}
.rest .r{flex:1;min-width:0}
.rest .rh{display:flex;align-items:baseline;gap:10px;margin-bottom:2px}
.rest .rank{font-family:var(--lat);font-weight:800;font-size:15px;color:var(--mute);font-variant-numeric:tabular-nums}
.rest .reach{font-family:var(--lat);font-weight:600;font-size:11px;color:var(--mute);letter-spacing:.06em}
.rest p{margin:0;font-size:13px;line-height:1.7;color:#4B4E52}

footer{margin-top:56px;padding-top:18px;border-top:1px solid var(--line);font-size:12px;color:var(--mute);max-width:44em}
</style>
</head>
<body>
<div class="wrap">

  <p class="eyebrow">Pick — which frame to post</p>
  <h1>選別<span>どれを出すか決める</span></h1>
  <p class="lede">同じ撮影から持ち帰った候補を並べると、投稿する一枚を選びます。作品としての出来ではなく、タイムラインで機能するかで選びます。</p>

  <div class="drop" id="drop" tabindex="0" role="button" aria-label="候補を選ぶ">
    <strong>候補を置く</strong>
    <small>2〜6枚。ドラッグ、クリック、または貼り付け</small>
  </div>
  <input type="file" id="file" accept="image/*" multiple hidden>

  <div class="sheet" id="sheet"></div>

  <label class="f" for="venue">Venue — 出す先</label>
  <select id="venue">
    <option>Threads</option>
    <option>Instagram フィード</option>
    <option>Instagram ストーリーズ</option>
    <option>X</option>
    <option>note</option>
  </select>

  <label class="f" for="note">Note — 撮影メモ（任意）</label>
  <textarea id="note" placeholder="狙い、場所、条件。例：福津の夕景。連投の一枚目に使いたい。"></textarea>

  <div class="tools">
    <button id="run" disabled>選別する</button>
    <button id="clear" class="ghost" hidden>全部外す</button>
    <input type="password" id="pass" placeholder="合言葉" autocomplete="off" hidden>
  </div>

  <div id="msg" class="msg" hidden></div>

  <section id="out" hidden aria-live="polite">
    <div class="won"><b id="wonRank">Pick</b><img id="wonImg" alt="選ばれた写真"></div>
    <div class="detail">
      <dl>
        <dt>Why</dt><dd id="why"></dd>
        <dt>Crop</dt><dd id="crop"></dd>
        <dt>Caption</dt><dd id="caption"></dd>
        <dt>Cut</dt><dd id="cut"></dd>
      </dl>
    </div>
    <ul class="rest" id="rest"></ul>
  </section>

  <footer>選ばれなかった写真が悪いわけではありません。ここで見ているのは、その媒体で止まるかどうかだけです。同じ候補でも出す先を変えると順位は入れ替わります。</footer>
</div>

<script>
const ENDPOINT = "/api/pick";
const MAX = 6;
let passcode = "";

const $ = s => document.querySelector(s);
const drop=$('#drop'), fileInput=$('#file'), runBtn=$('#run'), clearBtn=$('#clear');
const msg=$('#msg'), out=$('#out');
let shots = []; // {dataUrl, b64}

/* ---------- 候補の受け取り ---------- */
drop.addEventListener('click', ()=>fileInput.click());
drop.addEventListener('keydown', e=>{ if(e.key==='Enter'||e.key===' '){e.preventDefault();fileInput.click();} });
fileInput.addEventListener('change', e=>add([...e.target.files]));
['dragenter','dragover'].forEach(t=>drop.addEventListener(t,e=>{e.preventDefault();drop.classList.add('over');}));
['dragleave','drop'].forEach(t=>drop.addEventListener(t,e=>{e.preventDefault();drop.classList.remove('over');}));
drop.addEventListener('drop', e=>add([...e.dataTransfer.files]));
window.addEventListener('paste', e=>{
  const f=[...(e.clipboardData?.items||[])].filter(i=>i.type.startsWith('image/')).map(i=>i.getAsFile());
  if(f.length) add(f);
});
clearBtn.addEventListener('click', reset);

async function add(files){
  hideMsg();
  const imgs = files.filter(f=>f && f.type.startsWith('image/'));
  if(!imgs.length) return;
  const room = MAX - shots.length;
  if(room <= 0) return show(`候補は${MAX}枚までです。外してから足してください。`);
  if(imgs.length > room) show(`${MAX}枚を超える分は入れていません。`);

  for(const f of imgs.slice(0, room)){
    try{ shots.push(await shrink(f, 1200)); }
    catch{ show('読み込めない画像がありました。'); }
  }
  paint();
}

function paint(){
  $('#sheet').innerHTML = shots.map((s,i)=>
    `<div class="frame"><b>${i+1}</b><button class="x" data-i="${i}" aria-label="${i+1}枚目を外す">×</button><img src="${s.dataUrl}" alt="候補${i+1}"></div>`
  ).join('');
  runBtn.disabled = shots.length < 2;
  clearBtn.hidden = !shots.length;
  out.hidden = true;
}

$('#sheet').addEventListener('click', e=>{
  const b=e.target.closest('.x'); if(!b) return;
  shots.splice(+b.dataset.i, 1);
  paint(); hideMsg();
});

function reset(){
  shots=[]; fileInput.value='';
  paint(); hideMsg();
}

function shrink(file, max){
  return new Promise((res,rej)=>{
    const fr=new FileReader();
    fr.onerror=()=>rej(new Error('read'));
    fr.onload=()=>{
      const im=new Image();
      im.onerror=()=>rej(new Error('decode'));
      im.onload=()=>{
        const r=Math.min(1,max/Math.max(im.width,im.height));
        const c=document.createElement('canvas');
        c.width=Math.round(im.width*r); c.height=Math.round(im.height*r);
        c.getContext('2d').drawImage(im,0,0,c.width,c.height);
        const dataUrl=c.toDataURL('image/jpeg',0.85);
        res({dataUrl, b64:dataUrl.split(',')[1]});
      };
      im.src=fr.result;
    };
    fr.readAsDataURL(file);
  });
}

/* ---------- 選別 ---------- */
runBtn.addEventListener('click', pick);

async function pick(){
  if(shots.length < 2) return;
  runBtn.disabled=true; out.hidden=true;
  show(`${shots.length}枚を見ています。30秒ほどかかります。`,'working');

  try{
    const data = await call({
      images: shots.map(s=>s.b64),
      venue: $('#venue').value,
      note: $('#note').value.trim()
    });
    const text = (data.content||[]).filter(b=>b.type==='text').map(b=>b.text).join('\n');
    let r;
    try{ r = JSON.parse(text.replace(/```json|```/g,'').trim()); }
    catch{ return show('結果を読み取れませんでした。もう一度試してください。'); }
    if(!Array.isArray(r.ranking) || !r.ranking.length) return show('結果が不完全でした。もう一度試してください。');
    render(r);
    hideMsg();
  }catch(err){
    show('選別できませんでした。'+(err.message||'')+'　もう一度試してください。');
  }finally{
    runBtn.disabled = shots.length < 2;
  }
}

async function call(body){
  const r = await fetch(ENDPOINT,{
    method:"POST",
    headers:{"Content-Type":"application/json", ...(passcode?{"x-passcode":passcode}:{})},
    body: JSON.stringify(body)
  });
  let data=null;
  try{ data = await r.json(); }catch{}

  if(r.status===404 || r.status===405 || !data) throw new Error('中継（/api/pick）に届きません。デプロイを確認してください。');
  if(r.status===401){ $('#pass').hidden=false; $('#pass').focus(); throw new Error('合言葉が必要です。入力してもう一度。'); }
  if(!r.ok || data.type==='error' || data.error){
    const m = data?.error?.message || data?.error || data?.detail || `HTTP ${r.status}`;
    throw new Error(String(m).slice(0,180));
  }
  return data;
}
$('#pass').addEventListener('input', e=>{ passcode = e.target.value; });

/* ---------- 結果 ---------- */
function render(r){
  const ranking = r.ranking.filter(x=>shots[(+x.n||0)-1]); // 存在しない番号は捨てる
  if(!ranking.length) return show('結果の番号が候補と合いませんでした。もう一度試してください。');

  const top = Number.isFinite(+r.pick) && shots[+r.pick-1] ? +r.pick : +ranking[0].n;
  out.hidden=false;
  $('#wonImg').src = shots[top-1].dataUrl;
  $('#wonRank').textContent = `Pick — ${top}枚目`;
  $('#why').textContent     = r.why || '';
  $('#crop').textContent    = r.crop || '';
  $('#caption').textContent = r.caption || '';
  $('#cut').textContent     = r.cut || '';

  $('#rest').innerHTML = ranking.filter(x=>+x.n !== top).map((x,i)=>{
    const s = shots[+x.n-1];
    return `<li><img src="${s.dataUrl}" alt="${x.n}枚目"><div class="r">`+
      `<div class="rh"><span class="rank">${i+2}</span>`+
      `<span class="reach">${x.n}枚目 · reach ${Math.max(0,Math.min(100,+x.reach||0))}</span></div>`+
      `<p>${esc(x.note||'')}</p></div></li>`;
  }).join('');

  out.scrollIntoView({behavior:'smooth', block:'start'});
}

const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function show(t,kind){ msg.textContent=t; msg.className='msg'+(kind?' '+kind:''); msg.hidden=false; }
function hideMsg(){ msg.hidden=true; }
</script>
</body>
</html>
